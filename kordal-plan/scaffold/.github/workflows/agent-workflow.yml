name: Agent workflow
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: agent-workflow-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  structure:
    name: Agent structure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      # No per-task pull-request contract: tasks are integrated locally and
      # one pull request carries the milestone (docs/agents/workflow.md).
      - run: make agent-check
